<!-- MODALS (动态插入) -->

<!-- 黑名单 -->
<div class="modal-bg" id="m-bl">
  <div class="modal">
    <h3>添加黑名单</h3>
    <div class="fg"><label>QQ 号</label><input type="number" id="bl-qq"></div>
    <div class="fg"><label>名称</label><input id="bl-name"></div>
    <div class="fg"><label>群（空 = 全局）</label><select id="bl-gid" class="grp-sel"></select></div>
    <div class="fg"><label>原因</label><input id="bl-reason"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('m-bl')">取消</button>
      <button class="btn danger" onclick="blAddConfirm()">拉黑</button>
    </div>
  </div>
</div>

<!-- 群人设 -->
<div class="modal-bg" id="m-gp">
  <div class="modal">
    <h3 id="gp-title">群级人设</h3>
    <input type="hidden" id="gp-edit-gid">
    <div class="fr">
      <div class="fg"><label>Bot 名称</label><input id="gp-name"></div>
      <div class="fg"><label>性格</label>
        <select id="gp-personality"><option value="">默认</option><option>活泼</option><option>毒舌</option><option>温柔</option><option>严肃</option><option>幽默</option></select>
      </div>
    </div>
    <div class="fr">
      <div class="fg"><label>回复频率 (0-1)</label><input type="number" id="gp-freq" step="0.05" min="0" max="1"></div>
      <div class="fg"><label>表情风格</label>
        <select id="gp-emoji"><option value="mixed">混合</option><option value="minimal">少用</option><option value="heavy">多用</option></select>
      </div>
    </div>
    <div class="fg"><label>癖好（逗号分隔）</label><input id="gp-quirks"></div>
    <div class="actions">
      <button class="btn danger" id="gp-del" style="margin-right:auto;display:none" onclick="gpDel()">删除</button>
      <button class="btn" onclick="closeModal('m-bl')">取消</button>
      <button class="btn pri" onclick="gpSave()">保存</button>
    </div>
  </div>
</div>

<!-- 定时 -->
<div class="modal-bg" id="m-sch">
  <div class="modal">
    <h3>定时消息</h3>
    <div class="fg"><label>目标群</label><select id="sch-gid" class="grp-sel"></select></div>
    <div class="fg"><label>消息</label><textarea id="sch-msg" rows="3"></textarea></div>
    <div class="fg"><label>规则（HH:MM 或 interval:秒）</label><input id="sch-cron" placeholder="08:00"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('m-sch')">取消</button>
      <button class="btn pri" onclick="schSave()">保存</button>
    </div>
  </div>
</div>

<!-- 关键词 -->
<div class="modal-bg" id="m-kw">
  <div class="modal">
    <h3>添加违规词</h3>
    <div class="fg"><label>词语</label><input id="kw-w"></div>
    <div class="fg"><label>风险权重（0-10，越高越严重）</label><input type="number" id="kw-v" step="0.1" value="3"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('m-kw')">取消</button>
      <button class="btn pri" onclick="kwSave()">添加</button>
    </div>
  </div>
</div>

<!-- 审核样本 -->
<div class="modal-bg" id="m-tr">
  <div class="modal">
    <h3>添加审核样本</h3>
    <div class="fg"><label>消息内容</label><textarea id="tr-msg" rows="3"></textarea></div>
    <div class="fr">
      <div class="fg"><label>判定</label><select id="tr-label"><option value="violation">违规</option><option value="normal">正常</option></select></div>
      <div class="fg"><label>分类（如：广告 / 引战）</label><input id="tr-cat"></div>
    </div>
    <div class="actions">
      <button class="btn" onclick="closeModal('m-tr')">取消</button>
      <button class="btn pri" onclick="trSave()">添加</button>
    </div>
  </div>
</div>

<!-- 表情 -->
<div class="modal-bg" id="m-st">
  <div class="modal">
    <h3>添加表情</h3>
    <div class="fg"><label>类型</label>
      <select id="st-type"><option value="face">QQ 表情</option><option value="mface">商城表情</option><option value="image">图片表情</option></select>
    </div>
    <div class="fg"><label>CQ 码</label><input id="st-cq" placeholder="[CQ:face,id=14]"></div>
    <div class="fg"><label>标签（逗号分隔）</label><input id="st-tags"></div>
    <div class="actions">
      <button class="btn" onclick="closeModal('m-st')">取消</button>
      <button class="btn pri" onclick="stSave()">添加</button>
    </div>
  </div>
</div>
