<!-- PERSONALITY -->
<div class="card panel">
  <div class="panel-b">
    <div class="fr">
      <div class="fg"><label>名字</label><input id="p-name"></div>
      <div class="fg"><label>性格</label>
        <select id="p-personality"><option>活泼</option><option>毒舌</option><option>温柔</option><option>严肃</option><option>幽默</option></select>
      </div>
      <div class="fg"><label>风格</label>
        <select id="p-style"><option value="conversational">自然</option><option value="concise">简洁</option><option value="detailed">详细</option></select>
      </div>
    </div>
    <div class="fr">
      <div class="fg"><label>标签（逗号分隔）</label><input id="p-traits"></div>
      <div class="fg" style="max-width:120px"><label>Temperature</label><input type="number" id="p-temp" step="0.1" min="0" max="2"></div>
    </div>
    <div class="fr">
      <label class="tog"><input type="checkbox" id="p-auto"><span class="sw"></span>主动搭话<span class="lab-off">关</span><span class="lab-on">开</span></label>
      <div class="fg" style="max-width:120px"><label>搭话概率</label><input type="number" id="p-prob" step="0.01" min="0" max="1"></div>
    </div>
    <div class="fg"><label>自定义提示词（覆盖默认人设；机制附录会自动附加）</label>
      <textarea id="p-prompt" rows="6" placeholder="留空使用默认模板"></textarea>
    </div>
    <button class="btn pri" onclick="pSave()">保存</button>
  </div>
</div>
