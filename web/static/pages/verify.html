<!-- VERIFY (加群验证) -->
<!-- 网站认证比例配置 -->
<div class="card panel">
  <div class="panel-h">
    <span>🌐 网站认证模式比例</span>
    <span class="h-r"><span class="tag" id="verify-ratio-val">--%</span></span>
  </div>
  <div class="panel-b">
    <input type="range" id="verify-ratio-slider" min="0" max="100" value="50"
           style="width:100%">
    <div class="muted" style="display:flex;justify-content:space-between;font-size:12px;margin-top:4px">
      <span>全出题 (0%)</span>
      <span>全网站 (100%)</span>
    </div>
    <div class="muted" style="font-size:12px;margin-top:8px">
      每个新人进群时，按此概率走"网站认证"，其余走"出题认证"
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn pri" id="verify-ratio-save" onclick="saveVerifyRatio()">保存</button>
      <span id="verify-ratio-msg"></span>
    </div>
  </div>
</div>

<div class="stat-row" id="verify-stats"></div>
<div class="card panel">
  <div class="panel-b np"><div class="tw"><table class="tbl" id="verify-tbl">
    <thead><tr><th>时间</th><th>申请人</th><th class="num">QQ</th><th class="num">群</th><th>方式</th><th>结果</th><th>题目</th><th>回答</th><th class="num">次数</th></tr></thead>
    <tbody></tbody>
  </table></div></div>
</div>
