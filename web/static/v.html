<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>加群验证</title>
<style>
  :root {
    --accent: #2f6f57;
    --accent3: #5fa286;
    --accent-soft: #eaf3ee;
    --red: #c2363d;
    --fg: #1c1d22;
    --fg2: #5b5d68;
    --fg3: #8d8f99;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 20px; color: var(--fg);
  }
  .card {
    background: #fff; border-radius: 16px; padding: 32px 24px;
    max-width: 360px; width: 100%; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,.15);
  }
  .brand { font-size: 40px; margin-bottom: 8px; }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { font-size: 13px; color: var(--fg3); margin-bottom: 24px; }
  #step-captcha { margin-bottom: 20px; display: flex; justify-content: center; min-height: 65px; }
  #step-code { display: none; }
  .code-word {
    font-size: 48px; font-weight: 700; letter-spacing: 8px;
    color: var(--accent); margin: 16px 0; padding: 16px;
    background: var(--accent-soft); border-radius: 12px;
  }
  .hint { font-size: 13px; color: var(--fg2); line-height: 1.6; margin-top: 12px; }
  .err { color: var(--red); font-size: 14px; margin-top: 12px; }
  .loading { color: var(--fg3); font-size: 13px; }
</style>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head>
<body>
<div class="card">
  <div class="brand">🔐</div>
  <h1>加群验证</h1>
  <div class="sub">完成下方验证获取验证词</div>

  <div id="step-captcha">
    <div id="turnstile-box"></div>
  </div>

  <div id="step-code">
    <div class="loading" id="loading-tip">正在获取验证词…</div>
    <div class="code-word" id="code-display" style="display:none"></div>
    <div class="hint" id="code-hint" style="display:none">
      请把上方的词 <strong>@机器人</strong> 发到群里完成验证<br>
      <span style="color:var(--red)">词必须完全一致（空格标点可忽略）</span>
    </div>
  </div>

  <div class="err" id="err-tip"></div>

  <div class="hint" style="margin-top:20px;color:#aaa">
    打不开？复制链接到系统浏览器打开<br>
    链接失效？在群里联系管理员
  </div>
</div>

<script>
(function() {
  var m = location.pathname.match(/^\/v\/([A-Za-z0-9_-]+)/);
  var token = m ? m[1] : "";
  var errEl = document.getElementById("err-tip");
  var captchaStep = document.getElementById("step-captcha");
  var codeStep = document.getElementById("step-code");
  var codeDisplay = document.getElementById("code-display");
  var codeHint = document.getElementById("code-hint");
  var loadingTip = document.getElementById("loading-tip");
  var sitekey = "";
  var rendered = false;

  if (!token) {
    errEl.textContent = "验证链接无效，请重新触发";
    captchaStep.style.display = "none";
    return;
  }

  // 拉取 sitekey 配置
  fetch("/api/verify/config").then(function(r) { return r.json(); }).then(function(d) {
    sitekey = d.sitekey || "";
    if (window.turnstile) { renderTs(); }
  }).catch(function() {
    // 拉配置失败，继续（sitekey 为空时后端降级）
    if (window.turnstile) { renderTs(); }
  });

  // Turnstile api.js 加载完且 sitekey 就绪后 render
  window.onloadTurnstileCallback = function() {
    if (sitekey !== null && !rendered) { renderTs(); }
  };
  // 兜底：如果 api.js 已加载（event 漏触发）
  if (window.turnstile) { renderTs(); }

  function renderTs() {
    if (rendered) return;
    rendered = true;
    if (!sitekey) {
      // 未配置 sitekey → 直接拉词（后端降级）
      fetchCode(token, "");
      return;
    }
    turnstile.render("#turnstile-box", {
      sitekey: sitekey,
      callback: function(cfToken) { fetchCode(token, cfToken); },
      "error-callback": function() {
        errEl.textContent = "人机验证失败，请刷新重试";
      }
    });
  }

  function fetchCode(token, cfToken) {
    captchaStep.style.display = "none";
    codeStep.style.display = "block";
    fetch("/api/verify/code/" + token, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ cf_token: cfToken })
    })
    .then(function(r) {
      if (!r.ok) {
        return r.json().then(function(j) {
          throw new Error((j && j.detail) || "获取验证词失败");
        });
      }
      return r.json();
    })
    .then(function(d) {
      loadingTip.style.display = "none";
      codeDisplay.textContent = d.code;
      codeDisplay.style.display = "block";
      codeHint.style.display = "block";
    })
    .catch(function(e) {
      loadingTip.style.display = "none";
      errEl.textContent = e.message || "获取失败";
    });
  }
})();
</script>
</body>
</html>
